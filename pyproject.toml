[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-xchanges-os"
version = "0.1.0"
description = "Evidence-first EU youth mobility and trainer opportunity operating system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]
